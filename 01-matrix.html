<body>
    <div class="question-pane">

        <h1>542. 01 Matrix</h1>
        
        <div class="section-header">Description</div>
        <p style="line-height: 1.7; color: #ccc;">
            Given an <code>m x n</code> binary matrix <code>mat</code>, return the distance of the nearest 0 for each cell.
            <br><br>The distance between two adjacent cells is 1.
        </p>

        <div class="section-header">Example</div>
        <div class="example-box">
            <span class="example-label">Input</span>
            mat = [[0,0,0],[0,1,0],[1,1,1]]<br>
            <span class="example-label" style="margin-top:10px;">Output</span>
            [[0,0,0],[0,1,0],[1,2,1]]
        </div>
    </div>

    <div class="code-pane">
        <div class="code-header">
            <select id="lang-select" onchange="updateLang()">
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
            </select>
            <span id="file-label" style="color: var(--text-dim); font-size: 0.8rem; font-family: 'Fira Code';">solution.py</span>
        </div>
        <textarea id="code-display" readonly spellcheck="false"></textarea>
        <div class="terminal-footer">
            <button class="btn-solution" onclick="showFullCode()">Show Solution</button>
        </div>
    </div>

    <script>
        const codeRepo = {
            python: `class Solution:
    def updateMatrix(self, mat: List[List[int]]) -> List[List[int]]:
        rows, cols = len(mat), len(mat[0])
        queue = collections.deque()
        
        for r in range(rows):
            for c in range(cols):
                if mat[r][c] == 0:
                    queue.append((r, c))
                else:
                    mat[r][c] = float('inf')
        
        while queue:
            r, c = queue.popleft()
            for dr, dc in [(1,0), (-1,0), (0,1), (0,-1)]:
                nr, nc = r + dr, c + dc
                if 0 <= nr < rows and 0 <= nc < cols and mat[nr][nc] > mat[r][c] + 1:
                    mat[nr][nc] = mat[r][c] + 1
                    queue.append((nr, nc))
        return mat`,
            java: `class Solution {
    public int[][] updateMatrix(int[][] mat) {
        int m = mat.length, n = mat[0].length;
        Queue<int[]> q = new LinkedList<>();
        for (int i = 0; i < m; i++) {
            for (int j = 0; j < n; j++) {
                if (mat[i][j] == 0) q.offer(new int[]{i, j});
                else mat[i][j] = Integer.MAX_VALUE;
            }
        }
        int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};
        while (!q.isEmpty()) {
            int[] curr = q.poll();
            for (int[] d : dirs) {
                int r = curr[0] + d[0], c = curr[1] + d[1];
                if (r >= 0 && r < m && c >= 0 && c < n && mat[r][c] > mat[curr[0]][curr[1]] + 1) {
                    mat[r][c] = mat[curr[0]][curr[1]] + 1;
                    q.offer(new int[]{r, c});
                }
            }
        }
        return mat;
    }
}`,
            cpp: `class Solution {
public:
    vector<vector<int>> updateMatrix(vector<vector<int>>& mat) {
        int m = mat.size(), n = mat[0].size();
        queue<pair<int, int>> q;
        for (int i = 0; i < m; i++) {
            for (int j = 0; j < n; j++) {
                if (mat[i][j] == 0) q.push({i, j});
                else mat[i][j] = 1e9;
            }
        }
        int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
        while (!q.empty()) {
            auto [r, c] = q.front(); q.pop();
            for (int i = 0; i < 4; i++) {
                int nr = r + dr[i], nc = c + dc[i];
                if (nr >= 0 && nr < m && nc >= 0 && nc < n && mat[nr][nc] > mat[r][c] + 1) {
                    mat[nr][nc] = mat[r][c] + 1;
                    q.push({nr, nc});
                }
            }
        }
        return mat;
    }
};`,
            c: `typedef struct { int r, c; } Point;

int** updateMatrix(int** mat, int matSize, int* matColSize, int* returnSize, int** returnColumnSizes) {
    int m = matSize, n = matColSize[0];
    Point* queue = (Point*)malloc(m * n * sizeof(Point));
    int head = 0, tail = 0;

    for (int i = 0; i < m; i++) {
        for (int j = 0; j < n; j++) {
            if (mat[i][j] == 0) queue[tail++] = (Point){i, j};
            else mat[i][j] = 10001; // Large enough value
        }
    }

    int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
    while (head < tail) {
        Point curr = queue[head++];
        for (int i = 0; i < 4; i++) {
            int nr = curr.r + dr[i], nc = curr.c + dc[i];
            if (nr >= 0 && nr < m && nc >= 0 && nc < n && mat[nr][nc] > mat[curr.r][curr.c] + 1) {
                mat[nr][nc] = mat[curr.r][curr.c] + 1;
                queue[tail++] = (Point){nr, nc};
            }
        }
    }
    free(queue);
    *returnSize = m;
    *returnColumnSizes = matColSize;
    return mat;
}`
        };

        const fileLabels = { python: 'solution.py', java: 'Solution.java', cpp: 'solution.cpp', c: 'solution.c' };

        function updateLang() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('file-label').innerText = fileLabels[lang];
            document.getElementById('code-display').value = "";
        }

        function showFullCode() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('code-display').value = codeRepo[lang];
        }

        window.onload = updateLang;
    </script>
