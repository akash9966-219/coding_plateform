    <style>
        :root {
            --bg: #050505;
            --card-bg: #111;
            --primary: #00ff9d;
            --easy: #00ff9d;
            --medium: #ffb800;
            --hard: #ff4b4b;
            --text-dim: #888;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            padding: 40px 20px;
            background: radial-gradient(circle at 50% 0%, #11221a 0%, #050505 50%);
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            margin-bottom: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
        }

        h1 { font-size: 2.5rem; letter-spacing: -1px; }

        .search-bar {
            background: #1a1a1a;
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            width: 350px;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 255, 157, 0.2); }

        .category-group { margin-bottom: 60px; }

        h2 {
            font-size: 1.2rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h2::after { content: ""; height: 1px; flex-grow: 1; background: var(--border); }

        .problem-list { display: flex; flex-direction: column; gap: 10px; }

        .problem-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 18px 25px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .problem-row:hover {
            transform: translateX(10px);
            border-color: var(--primary);
            background: rgba(0, 255, 157, 0.05);
        }

        .problem-info { display: flex; align-items: center; gap: 20px; }
        .title { font-weight: 500; font-size: 1.1rem; color: #eee; }

        .difficulty {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .Easy { color: var(--easy); background: rgba(0, 255, 157, 0.1); }
        .Medium { color: var(--medium); background: rgba(255, 184, 0, 0.1); }
        .Hard { color: var(--hard); background: rgba(255, 75, 75, 0.1); }

function renderProblems() {
    const container = document.getElementById('problem-container');
    // Clear container first to avoid duplicates
    container.innerHTML = "";
    
    // Get unique categories in order of appearance
    const categories = [];
    questionsData.forEach(item => {
        if (!categories.includes(item.cat)) {
            categories.push(item.cat);
        }
    });

    categories.forEach(category => {
        const section = document.createElement('section');
        section.className = 'category-group';
        
        const title = document.createElement('h2');
        title.innerText = category;
        section.appendChild(title);

        const list = document.createElement('div');
        list.className = 'problem-list';

        questionsData.filter(q => q.cat === category).forEach(problem => {
            const row = document.createElement('div');
            row.className = 'problem-row';
            row.onclick = () => goToTerminal(problem.q);
            
            row.innerHTML = `
                <div class="problem-info">
                    <span class="status-icon">○</span>
                    <span class="title">${problem.q}</span>
                </div>
                <span class="difficulty ${problem.diff}">${problem.diff}</span>
            `;
            list.appendChild(row);
        });

        section.appendChild(list);
        container.appendChild(section);
    });
}

function filterProblems() {
    const input = document.querySelector('.search-bar').value.toLowerCase();
    const rows = document.querySelectorAll('.problem-row');
    
    rows.forEach(row => {
        const text = row.querySelector('.title').innerText.toLowerCase();
        row.style.display = text.includes(input) ? 'flex' : 'none';
    });
}

function goToTerminal(questionTitle) {
    const encodedTitle = encodeURIComponent(questionTitle);
    window.location.href = `${encodedTitle}.html`;
}

window.onload = renderProblems;
