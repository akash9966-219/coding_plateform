<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Detail | CodeTerminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505; --panel: #0d0d0d; --primary: #00ff9d;
            --border: rgba(255, 255, 255, 0.1); --text-main: #ffffff; --text-dim: #999;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Space Grotesk', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        .question-pane { width: 45%; padding: 40px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--panel); }
        .pane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-btn { text-decoration: none; color: var(--text-dim); font-size: 0.85rem; border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px; transition: 0.2s; }
        .back-btn:hover { color: var(--primary); border-color: var(--primary); background: rgba(0, 255, 157, 0.05); }
        .difficulty { color: #facc15; font-size: 0.8rem; font-weight: 700; border: 1px solid #facc15; padding: 4px 12px; border-radius: 50px; display: inline-block; background: rgba(250, 204, 21, 0.05); }
        h1 { font-size: 2.2rem; margin: 20px 0; letter-spacing: -1px; }
        .section-header { color: var(--primary); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 15px; font-weight: 700; margin-top: 25px; }
        .example-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 20px; border-radius: 12px; font-family: 'Fira Code', monospace; font-size: 0.9rem; margin-bottom: 20px; }
        .example-label { color: var(--primary); margin-bottom: 10px; display: block; font-size: 0.75rem; }

        .code-pane { width: 55%; display: flex; flex-direction: column; background: #000; }
        .code-header { background: #111; padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        select { background: #222; color: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; outline: none; cursor: pointer; font-family: inherit; }
        #code-display { flex: 1; padding: 30px; font-family: 'Fira Code', monospace; font-size: 1rem; line-height: 1.6; color: #00ff9d; background: transparent; border: none; outline: none; white-space: pre; overflow: auto; }
        .terminal-footer { padding: 20px 30px; background: #0a0a0a; display: flex; justify-content: flex-end; border-top: 1px solid var(--border); }
        .btn-solution { background: var(--primary); color: #000; padding: 12px 30px; border-radius: 8px; font-weight: 800; cursor: pointer; border: none; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="question-pane">
        <div class="pane-header">
            <a href="dp.html" class="back-btn">← Back to DP Roadmap</a>
            <span class="difficulty">Medium</span>
        </div>
        <h1>96. Unique BSTs</h1>
        
        <div class="section-header">Description</div>
        <p style="line-height: 1.7; color: #ccc;">
            Given an integer <code>n</code>, return the number of structurally unique <b>BST's</b> (binary search trees) which has exactly <code>n</code> nodes of unique values from <code>1</code> to <code>n</code>.
        </p>

        <div class="section-header">Example</div>
        <div class="example-box">
            <span class="example-label">Input</span>
            n = 3<br>
            <span class="example-label" style="margin-top:10px;">Output</span>
            5
        </div>
    </div>

    <div class="code-pane">
        <div class="code-header">
            <select id="lang-select" onchange="updateLang()">
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
            </select>
            <span id="file-label" style="color: var(--text-dim); font-size: 0.8rem; font-family: 'Fira Code';">solution.py</span>
        </div>
        <textarea id="code-display" readonly spellcheck="false"></textarea>
        <div class="terminal-footer">
            <button class="btn-solution" onclick="showFullCode()">Show Solution</button>
        </div>
    </div>

    <script>
        const codeRepo = {
            python: `class Solution:
    def numTrees(self, n: int) -> int:
        # G[i] tracks the number of unique BSTs with i nodes
        G = [0] * (n + 1)
        G[0] = 1 # Empty tree
        G[1] = 1 # Single node tree
        
        # Build DP table from 2 nodes up to n nodes
        for nodes in range(2, n + 1):
            for root in range(1, nodes + 1):
                # Cartesion product: Left Subtree count * Right Subtree count
                G[nodes] += G[root - 1] * G[nodes - root]
                
        return G[n]`,
            java: `class Solution {
    public int numTrees(int n) {
        // G[i] is the number of unique BSTs for i nodes
        int[] G = new int[n + 1];
        G[0] = 1; // Base case: empty tree
        G[1] = 1; // Base case: 1 node
        
        for (int i = 2; i <= n; i++) {
            for (int j = 1; j <= i; j++) {
                // j acts as the root; j-1 nodes on left, i-j nodes on right
                G[i] += G[j - 1] * G[i - j];
            }
        }
        return G[n];
    }
}`,
            cpp: `class Solution {
public:
    int numTrees(int n) {
        vector<int> G(n + 1, 0);
        G[0] = 1;
        G[1] = 1;
        
        for (int i = 2; i <= n; ++i) {
            for (int j = 1; j <= i; ++j) {
                // Summing unique combinations for each pivot 'j'
                G[i] += G[j - 1] * G[i - j];
            }
        }
        return G[n];
    }
};`,
            c: `int numTrees(int n) {
    // Dynamic array for Catalan Number calculation
    int* G = (int*)calloc(n + 1, sizeof(int));
    G[0] = 1;
    G[1] = 1;
    
    for (int i = 2; i <= n; i++) {
        for (int j = 1; j <= i; j++) {
            G[i] += G[j - 1] * G[i - j];
        }
    }
    int result = G[n];
    free(G);
    return result;
}`
        };

        const fileLabels = { python: 'solution.py', java: 'Solution.java', cpp: 'solution.cpp', c: 'solution.c' };

        function updateLang() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('file-label').innerText = fileLabels[lang];
            document.getElementById('code-display').value = "";
        }

        function showFullCode() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('code-display').value = codeRepo[lang];
        }

        window.onload = updateLang;
    </script>
</body>
</html>
