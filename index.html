<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeTerminal | Elite Prep</title>
    <style>
        :root {
            --primary: #00ff9d;
            --accent: #00e5ff;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevent scrolling on landing */
        }

        /* --- BACKGROUND ANIMATION --- */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
        }

        .float-tag {
            position: absolute;
            white-space: nowrap;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: var(--primary);
            opacity: 0.3;
            user-select: none;
            filter: blur(0.5px);
            animation: move linear infinite;
        }

        @keyframes move {
            from { transform: translateY(100vh) translateX(0); }
            to { transform: translateY(-10vh) translateX(20px); }
        }

        /* --- GLASS CONTENT --- */
        .container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .hero-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            padding: 60px 80px;
            border-radius: 24px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 5rem;
            letter-spacing: -2px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #aaa;
            font-size: 1.2rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .glow-btn {
            padding: 18px 45px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
            background: var(--primary);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
        }

        .glow-btn:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 0 40px var(--primary);
            background: #fff;
        }

    </style>
</head>
<body>

    <div class="ambient-bg" id="bg">
        </div>

    <div class="container">
        <div class="hero-card">
            <h1>&lt;CODE/&gt;</h1>
            <p>CRACK THE TOP 100 INTERVIEW QUESTIONS</p>
            <button class="glow-btn" onclick="startExperience()">Initiate Terminal</button>
        </div>
    </div>

    <script>
        const tags = [
            "Tarjan's Algorithm", "Kosaraju", "SELECT *", "O(N log N)", 
            "Dynamic Programming", "Red-Black Trees", "LRU Cache", 
            "Dijkstra", "B-Trees", "Sliding Window", "JOIN", "HAVING", 
            "Backtracking", "Trie Data Structure", "QuickSort"
        ];

        const bg = document.getElementById('bg');

        // Create 25 floating tags at random intervals
        function createTags() {
            for (let i = 0; i < 25; i++) {
                const tag = document.createElement('div');
                tag.className = 'float-tag';
                tag.innerText = tags[Math.floor(Math.random() * tags.length)];
                
                // Randomize appearance
                const left = Math.random() * 100;
                const duration = 10 + Math.random() * 20;
                const delay = Math.random() * 15;
                const fontSize = 0.8 + Math.random() * 1.5;
                
                tag.style.left = `${left}%`;
                tag.style.animationDuration = `${duration}s`;
                tag.style.animationDelay = `-${delay}s`;
                tag.style.fontSize = `${fontSize}rem`;
                
                // Add specific accent color to some tags
                if(i % 3 === 0) tag.style.color = 'var(--accent)';
                
                bg.appendChild(tag);
            }
        }

        function startExperience() {
            // Add a "glitch" or transition effect here
            document.querySelector('.hero-card').style.opacity = '0';
            setTimeout(() => {
                window.location.href = 'topics.html';
            }, 1000);
        }

        createTags();
    </script>
</body>
</html>
