<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Study Plan | CodeTerminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --panel: #0d0d0d;
            --primary: #00ff9d;
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #999;
            --easy: #00ff9d;
            --medium: #ffb800;
            --hard: #ff3e3e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            padding: 40px;
            line-height: 1.6;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 60px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: -2px;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 50px;
        }

        .category-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .category-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            display: block;
        }

        .card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            background: rgba(0, 255, 157, 0.02);
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #fff;
            padding-right: 40px;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .diff-tag {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .diff-tag.easy { color: var(--easy); border: 1px solid var(--easy); }
        .diff-tag.medium { color: var(--medium); border: 1px solid var(--medium); }
        .diff-tag.hard { color: var(--hard); border: 1px solid var(--hard); }

        .btn-view {
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .card:hover .btn-view {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <a href="topics.html" class="back-btn">← Back to List</a>

        <h1>Code-75</h1>
        <p style="color: var(--text-dim);">The Essential LeetCode Study Plan</p>

        const container = document.getElementById('dashboard');

        studyPlan.forEach(section => {
            const sectionEl = document.createElement('div');
            sectionEl.className = 'category-section';
            
            sectionEl.innerHTML = `
                <h2 class="category-title">${section.category}</h2>
                <div class="grid">
                    ${section.problems.map(prob => `
                        <a href="${prob.name}.html" class="card">
                            <h3>${prob.name}</h3>
                            <div class="card-meta">
                                <span class="diff-tag ${prob.diff}">${prob.diff}</span>
                                <span class="btn-view">VIEW SOLUTION ></span>
                            </div>

                    `).join('')}
                </div>
            `;
            container.appendChild(sectionEl);
        });
    </script>
</body>
</html>
