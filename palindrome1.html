        #code-display { flex: 1; padding: 30px; font-family: 'Fira Code', monospace; font-size: 1rem; line-height: 1.6; color: #00ff9d; background: transparent; border: none; outline: none; white-space: pre; overflow: auto; }

<body>
    <div class="question-pane">
        <div class="pane-header">
            <a href="dp.html" class="back-btn">← Back to DP Roadmap</a>
            <span class="difficulty">Medium</span>
        </div>
        <h1>5. Longest Palindromic Substring</h1>
        
        <div class="section-header">Description</div>
        <p style="line-height: 1.7; color: #ccc;">
            Given a string <code>s</code>, return <i>the longest palindromic substring</i> in <code>s</code>.
        </p>

        <div class="section-header">Example</div>
        <div class="example-box">
            <span class="example-label">Input</span>
            s = "babad"<br>
            <span class="example-label" style="margin-top:10px;">Output</span>
            "bab"<br>
            <span class="example-label" style="margin-top:10px;">Note</span>
            "aba" is also a valid answer.
        </div>
    </div>

    <div class="code-pane">
        <div class="code-header">
            <select id="lang-select" onchange="updateLang()">
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
            </select>
            <span id="file-label" style="color: var(--text-dim); font-size: 0.8rem; font-family: 'Fira Code';">solution.py</span>
        </div>
        <textarea id="code-display" readonly spellcheck="false"></textarea>
        <div class="terminal-footer">
            <button class="btn-solution" onclick="showFullCode()">Show Solution</button>
        </div>
    </div>

    <script>
        const codeRepo = {
            python: `class Solution:
    def longestPalindrome(self, s: str) -> str:
        res = ""
        resLen = 0
        
        for i in range(len(s)):
            # odd length
            l, r = i, i
            while l >= 0 and r < len(s) and s[l] == s[r]:
                if (r - l + 1) > resLen:
                    res = s[l:r+1]
                    resLen = r - l + 1
                l -= 1
                r += 1
                
            # even length
            l, r = i, i + 1
            while l >= 0 and r < len(s) and s[l] == s[r]:
                if (r - l + 1) > resLen:
                    res = s[l:r+1]
                    resLen = r - l + 1
                l -= 1
                r += 1
                
        return res`,
            java: `class Solution {
    public String longestPalindrome(String s) {
        if (s == null || s.length() < 1) return "";
        int start = 0, end = 0;
        for (int i = 0; i < s.length(); i++) {
            int len1 = expandAroundCenter(s, i, i);
            int len2 = expandAroundCenter(s, i, i + 1);
            int len = Math.max(len1, len2);
            if (len > end - start) {
                start = i - (len - 1) / 2;
                end = i + len / 2;
            }
        }
        return s.substring(start, end + 1);
    }

    private int expandAroundCenter(String s, int left, int right) {
        while (left >= 0 && right < s.length() && s.charAt(left) == s.charAt(right)) {
            left--;
            right++;
        }
        return right - left - 1;
    }
}`,
            cpp: `class Solution {
public:
    string longestPalindrome(string s) {
        int n = s.size();
        if (n < 2) return s;
        int start = 0, maxLen = 1;
        
        for (int i = 0; i < n; ) {
            if (n - i <= maxLen / 2) break;
            int j = i, k = i;
            while (k < n - 1 && s[k+1] == s[k]) k++;
            i = k + 1;
            while (k < n - 1 && j > 0 && s[k+1] == s[j-1]) {
                k++; j--;
            }
            if (k - j + 1 > maxLen) {
                start = j;
                maxLen = k - j + 1;
            }
        }
        return s.substr(start, maxLen);
    }
};`,
            c: `char * longestPalindrome(char * s){
    int n = strlen(s);
    if (n < 2) return s;
    int start = 0, maxLen = 1;
    for (int i = 0; i < n; i++) {
        // Odd
        int l = i, r = i;
        while (l >= 0 && r < n && s[l] == s[r]) {
            if (r - l + 1 > maxLen) {
                start = l;
                maxLen = r - l + 1;
            }
            l--; r++;
        }
        // Even
        l = i, r = i + 1;
        while (l >= 0 && r < n && s[l] == s[r]) {
            if (r - l + 1 > maxLen) {
                start = l;
                maxLen = r - l + 1;
            }
            l--; r++;
        }
    }
    char* res = (char*)malloc((maxLen + 1) * sizeof(char));
    strncpy(res, s + start, maxLen);
    res[maxLen] = '\\0';
    return res;
}`
        };

        const fileLabels = { python: 'solution.py', java: 'Solution.java', cpp: 'solution.cpp', c: 'solution.c' };

        function updateLang() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('file-label').innerText = fileLabels[lang];
            document.getElementById('code-display').value = "";
        }

        function showFullCode() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('code-display').value = codeRepo[lang];
        }

        window.onload = updateLang;
    </script>
