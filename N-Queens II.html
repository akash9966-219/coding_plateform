    <div class="question-pane">

        <h1>52. N-Queens II</h1>
        
        <div class="desc">
            Find the number of distinct solutions to the N-Queens puzzle.
        </div>

        <div class="visual-container">
            <img src="https://assets.leetcode.com/uploads/2020/11/13/queens.jpg" alt="Queens Placement Example">
        </div>

        <div class="example-box">
            <b>Input:</b> n = 4<br>
            <b>Output:</b> 2
        </div>

        <div class="desc" style="font-size: 0.85rem; color: var(--text-dim);">
            Time Complexity: O(N!) <br>
            Space Complexity: O(N)
        </div>
    </div>

    <div class="code-pane">
        <div class="code-header">
            <select id="lang-select" onchange="resetView()">
                <option value="java">Java</option>
                <option value="python">Python</option>
                <option value="cpp">C++</option>
                <option value="c">C</option>
            </select>
            <span id="file-label" style="color: var(--text-dim); font-size: 0.8rem; font-family: 'Fira Code';">Solution.java</span>
        </div>

        <textarea id="code-display" readonly spellcheck="false" placeholder="Click 'SHOW FULL SOLUTION'..."></textarea>

        <div class="terminal-footer">
            <button class="btn-solution" onclick="showFullCode()">Show Full Solution</button>
        </div>
    </div>

    <script>
        const codeRepo = {
            java: `class Solution {\n    int count = 0;\n    public int totalNQueens(int n) {\n        boolean[] cols = new boolean[n];\n        boolean[] d1 = new boolean[2 * n];\n        boolean[] d2 = new boolean[2 * n];\n        backtrack(0, n, cols, d1, d2);\n        return count;\n    }\n\n    private void backtrack(int r, int n, boolean[] cols, boolean[] d1, boolean[] d2) {\n        if (r == n) { count++; return; }\n        for (int c = 0; c < n; c++) {\n            int id1 = r + c;\n            int id2 = r - c + n;\n            if (cols[c] || d1[id1] || d2[id2]) continue;\n            cols[c] = d1[id1] = d2[id2] = true;\n            backtrack(r + 1, n, cols, d1, d2);\n            cols[c] = d1[id1] = d2[id2] = false;\n        }\n    }\n}`,
            python: `class Solution:\n    def totalNQueens(self, n: int) -> int:\n        self.count = 0\n        cols = [False] * n\n        d1 = [False] * (2 * n)\n        d2 = [False] * (2 * n)\n        \n        def backtrack(r):\n            if r == n:\n                self.count += 1\n                return\n            for c in range(n):\n                id1, id2 = r + c, r - c + n\n                if cols[c] or d1[id1] or d2[id2]: continue\n                cols[c] = d1[id1] = d2[id2] = True\n                backtrack(r + 1)\n                cols[c] = d1[id1] = d2[id2] = False\n        \n        backtrack(0)\n        return self.count`,
            cpp: `class Solution {\n    int count = 0;\npublic:\n    int totalNQueens(int n) {\n        vector<bool> cols(n), d1(2*n), d2(2*n);\n        backtrack(0, n, cols, d1, d2);\n        return count;\n    }\n    void backtrack(int r, int n, vector<bool>& cols, vector<bool>& d1, vector<bool>& d2) {\n        if (r == n) { count++; return; }\n        for (int c = 0; c < n; c++) {\n            int id1 = r + c, id2 = r - c + n;\n            if (cols[c] || d1[id1] || d2[id2]) continue;\n            cols[c] = d1[id1] = d2[id2] = true;\n            backtrack(r + 1, n, cols, d1, d2);\n            cols[c] = d1[id1] = d2[id2] = false;\n        }\n    }\n};`,
            c: `void solve(int r, int n, int* cols, int* d1, int* d2, int* count) {\n    if (r == n) { (*count)++; return; }\n    for (int c = 0; c < n; c++) {\n        int id1 = r + c, id2 = r - c + n;\n        if (cols[c] || d1[id1] || d2[id2]) continue;\n        cols[c] = d1[id1] = d2[id2] = 1;\n        solve(r + 1, n, cols, d1, d2, count);\n        cols[c] = d1[id1] = d2[id2] = 0;\n    }\n}\n\nint totalNQueens(int n) {\n    int count = 0, cols[10] = {0}, d1[20] = {0}, d2[20] = {0};\n    solve(0, n, cols, d1, d2, &count);\n    return count;\n}`
        };

        function resetView() {
            const lang = document.getElementById('lang-select').value;
            const extMap = { java: 'java', python: 'py', cpp: 'cpp', c: 'c' };
            document.getElementById('code-display').value = "";
            document.getElementById('file-label').innerText = `Solution.${extMap[lang]}`;
        }

        function showFullCode() {
            const lang = document.getElementById('lang-select').value;
            document.getElementById('code-display').value = codeRepo[lang];
        }

        window.onload = resetView;
    </script>
</body>
